<?xml version="1.0" encoding="UTF-8"?>
<!-- Agentao in Chrome icon source. Run scripts/generate_icon.py to produce icon-128.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4e8df5"/>
      <stop offset="100%" stop-color="#7c5cf5"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Outer ring: the "Tao" / path -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <!-- Inner dot: the agent -->
  <circle cx="64" cy="64" r="14" fill="url(#ring)"/>
  <!-- Path line through the center -->
  <line x1="26" y1="64" x2="102" y2="64" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
