[project]
name = "agentao-chrome-host"
version = "0.1.0"
description = "Chrome Native Messaging host that embeds the Agentao runtime."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "agentao>=0.4.18",
]

[project.optional-dependencies]
# For building the standalone executable (scripts/build_native_host.py).
build = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false
